<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Bee">
  <!--
    Plugin Store icon. Rounded tile in the plugin's accent, mark in #FEFEFE — the shape the rest of
    the family uses, so a row of these in the Plugin Store reads as one shelf. Tile radius 22.44%,
    matching Appleseed's rx="35" on a 156px square.

    A honeybee seen from above: two antennae with ball tips, a scooped head, four wings, and a
    banded abdomen ending in a sting. Every part is a separate closed path with a real gap between
    it and its neighbours — nothing here relies on a stroke in the tile colour, so the same geometry
    drops straight into icon-mask.svg, where there is no tile to paint a gap with.

    The mark is symmetric about x=50 by construction: the left half is drawn and mirrored, so the
    two halves cannot drift apart when the shape is edited.
  -->
